[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "club-agent"
version = "0.6.0"
description = "基於 AI Agent 之校園學生社團全方位營運顧問與專案優化系統（行銷宣傳與數據診斷模組）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
claude = ["anthropic>=1.8"]
dev = ["pytest>=8"]

[project.scripts]
club-agent = "club_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
club_agent = ["knowledge_base/*.md", "knowledge_base/departments/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
